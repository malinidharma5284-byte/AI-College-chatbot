<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Chatbot</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .chat-container {
        width: 420px;
        height: 600px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .chat-header {
        background: #4a6cf7;
        color: white;
        padding: 16px;
        font-size: 18px;
        font-weight: 600;
    }
    #chatbox {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 75%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        animation: fadeIn 0.2s ease-in;
    }
    .user {
        align-self: flex-end;
        background: #4a6cf7;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .bot {
        align-self: flex-start;
        background: #e9ecf5;
        color: #222;
        border-bottom-left-radius: 4px;
    }
    .typing {
        align-self: flex-start;
        color: #888;
        font-style: italic;
        font-size: 13px;
    }
    .input-area {
        display: flex;
        border-top: 1px solid #eee;
        padding: 10px;
        gap: 8px;
    }
    #msg {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 20px;
        outline: none;
        font-size: 14px;
    }
    #sendBtn {
        background: #4a6cf7;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 14px;
    }
    #sendBtn:hover { background: #3a5ce0; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">🎓 College Chatbot</div>
    <div id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="msg" placeholder="Ask about fees, admissions, placements..." autocomplete="off">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, className) {
        const div = document.createElement("div");
        div.className = "msg " + className;
        div.textContent = text;
        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;
        return div;
    }

    function showTyping() {
        const div = document.createElement("div");
        div.className = "typing";
        div.id = "typingIndicator";
        div.textContent = "Bot is typing...";
        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById("typingIndicator");
        if (el) el.remove();
    }

    function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        showTyping();

        fetch("/get", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "msg=" + encodeURIComponent(message)
        })
        .then(res => res.json())
        .then(data => {
            removeTyping();
            addMessage(data.response, "bot");
        })
        .catch(() => {
            removeTyping();
            addMessage("Something went wrong. Please try again.", "bot");
        });
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });

    // Initial greeting
    window.onload = () => addMessage("Hi! Ask me about fees, admissions, placements, courses, or internships.", "bot");
</script>
</body>
</html>
